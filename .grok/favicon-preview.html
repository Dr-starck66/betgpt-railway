<!DOCTYPE html>
<html>
  <head>
<meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html, body { margin: 0; padding: 0; background: #111; }
      .row { display: flex; gap: 16px; padding: 16px; align-items: end; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #888; font: 11px sans-serif; }
      img { display: block; image-rendering: auto; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="cell"><img src="favicon.svg" width="128" height="128" alt="128" />128</div>
      <div class="cell"><img src="favicon.svg" width="64" height="64" alt="64" />64</div>
      <div class="cell"><img src="favicon.svg" width="32" height="32" alt="32" />32</div>
      <div class="cell"><img src="favicon.svg" width="16" height="16" alt="16" />16</div>
    </div>
  </body>
</html>
