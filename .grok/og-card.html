<!DOCTYPE html>
<html lang="en">
  <head>
<meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Inter;
        src: url("./fonts/Inter-Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: Inter;
        src: url("./fonts/Inter-SemiBold.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: Inter;
        src: url("./fonts/Inter-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0B0E14;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #0B0E14;
        color: #F4F6FA;
      }
      .bg {
        position: absolute;
        inset: 0;
        background: url("og-bg-desk.jpg") center 42% / cover no-repeat;
        filter: saturate(1.05) contrast(1.04);
      }
      .veil {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 62% at 50% 48%, rgb(11 14 20 / 0.28) 0%, rgb(11 14 20 / 0.62) 48%, rgb(11 14 20 / 0.88) 100%),
          linear-gradient(180deg, rgb(11 14 20 / 0.18), rgb(11 14 20 / 0.55));
      }
      .lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 72px 160px;
        gap: 0;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin-bottom: 22px;
      }
      .word {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        font-size: 128px;
        letter-spacing: -0.045em;
        line-height: 0.9;
        color: #F4F6FA;
        text-shadow: 0 18px 44px rgb(0 0 0 / 0.55);
      }
      .word .gpt {
        color: #00E38C;
      }
      .rule {
        width: 72px;
        height: 3px;
        border-radius: 2px;
        background: #00E38C;
        margin: 26px 0 18px;
        box-shadow: 0 0 18px rgb(0 227 140 / 0.45);
      }
      .tag {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-weight: 500;
        font-size: 18px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #C9D0DC;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bg"></div>
      <div class="veil"></div>
      <div class="lockup">
        <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0B0E14"/>
          <g transform="translate(15.2 17.6)">
            <circle r="9.5" fill="#F4F6FA"/>
            <polygon points="0,-5.4 5.14,-1.76 3.18,4.36 -3.18,4.36 -5.14,-1.76" fill="#0B0E14"/>
            <path d="M0-5.4 0-9.5M5.14-1.76 8.55-4.4M3.18 4.36 5.15 8.55M-3.18 4.36-5.15 8.55M-5.14-1.76-8.55-4.4" fill="none" stroke="#0B0E14" stroke-width="1.35" stroke-linecap="round"/>
          </g>
          <path d="M24.8 5.4l1.35 3.05 3.05 1.3-3.05 1.3-1.35 3.05-1.35-3.05-3.05-1.3 3.05-1.3z" fill="#00E38C"/>
        </svg>
        <div class="word">Bet<span class="gpt">Gpt</span></div>
        <div class="rule"></div>
        <div class="tag">Football intelligence</div>
      </div>
    </div>
  </body>
</html>
