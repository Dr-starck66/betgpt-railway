name: BetGPT ASTRA Launch Video Ω

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/astra-launch-video.yml"
      - "scripts/astra-launch-video.mjs"
      - "scripts/astra-launch-video-guard.mjs"
      - "scripts/astra-launch-video.test.mjs"
      - "scripts/lib/astra-launch-video.mjs"
      - "config/astra-launch-video.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/astra-launch-video.yml"
      - "scripts/astra-launch-video.mjs"
      - "scripts/astra-launch-video-guard.mjs"
      - "scripts/astra-launch-video.test.mjs"
      - "scripts/lib/astra-launch-video.mjs"
      - "config/astra-launch-video.json"

permissions:
  contents: read

jobs:
  launch-video:
    uses: Dr-starck66/zip-github/.github/workflows/astra-launch-video.yml@main
    with:
      project_name: BetGPT
      project_url: https://betgpt.live
      tagline: "Pronostics football : preuves avant promesses."
      duration_seconds: 18
      formats: "landscape,vertical,square"
      capture_json: '{"preseedLocalStorage":{"betgpt-18":"1"},"forbiddenText":["As-tu 18 ans ou plus ?"],"requiredText":["Pronostics"]}'
