name: ASTRA MASTER GATE Omega
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  astra-master-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies without running lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate TypeScript before any release promotion (read-only)
        run: npm run typecheck
      - name: Check universal YouTube fixture video component
        run: node --experimental-strip-types --test scripts/astra-match-youtube.test.mjs
      - name: Run ASTRA core regression tests
        run: node --test scripts/astra-master-gate.test.mjs
      - name: Central proof gate - source changes
        run: node scripts/astra-master-gate.mjs --task=code --strict
      - name: Central proof gate - all other site scopes
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/astra-master-gate.mjs --task=all --strict --report=artifacts/astra-master-gate/all-report.json
      - name: Preserve verifiable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-master-gate-betgpt
          path: artifacts/astra-master-gate/*.json
          if-no-files-found: error
