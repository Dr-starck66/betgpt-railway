name: ASTRA Cloud Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/chat-external-smoke.yml"
      - "scripts/astra-cloud-bridge.mjs"
      - "scripts/astra-wait-public-revision.mjs"
      - "config/astra-cloud-bridge.json"
      - "src/lib/chat/**"
      - "server/api/chat.post.ts"

permissions:
  contents: read

concurrency:
  group: astra-cloud-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for public autosync revision
        run: node scripts/astra-wait-public-revision.mjs "$GITHUB_SHA"

      - name: Probe real production targets
        id: bridge
        continue-on-error: true
        run: node scripts/astra-cloud-bridge.mjs config/astra-cloud-bridge.json

      - name: Publish evidence to job summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/astra-cloud-bridge-summary.md ]; then
            cat artifacts/astra-cloud-bridge-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# ASTRA CLOUD BRIDGE" >> "$GITHUB_STEP_SUMMARY"
            echo "Evidence file missing — FAIL." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-cloud-bridge-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce bridge result
        if: always()
        shell: bash
        run: |
          test -f artifacts/astra-cloud-bridge-evidence.json
          node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync("artifacts/astra-cloud-bridge-evidence.json","utf8"));console.log("ASTRA FINAL",e.status,e.selectedTarget);if(e.status!=="PASS")process.exit(1)'
