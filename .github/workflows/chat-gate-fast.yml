name: BetGPT Chat Gate Fast

on:
  push:
    paths:
      - ".github/workflows/chat-gate-fast.yml"
      - ".github/chat-gate-fast.trigger"
      - "src/lib/chat/**"
      - "src/components/chat-panel.tsx"
      - "server/api/punch-gif.post.ts"

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Personality anti-fatigue gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          url="https://betgpt.live/api/chat"
          memory={
            "sarcasticIntensity":100,
            "blackBook":{
              "combinésDePlus5Matchs":3,
              "jaiUnFeeling":2,
              "parisModifiésDerniereSeconde":1,
              "matchsImpossiblesAPerdre":2,
              "matchsEffectivementPerdus":1,
              "niveauDeConfianceInjustifie":3
            },
            "preferences":{"favoriteTeams":[],"favoriteCompetitions":[]}
          }
          def ask(messages):
            payload=json.dumps({"messages":messages,"requestedMode":"ROAST","userMemory":memory}).encode()
            req=urllib.request.Request(url,data=payload,headers={"content-type":"application/json","user-agent":"BetGPT-Personality-Gate/1.0"},method="POST")
            with urllib.request.urlopen(req,timeout=25) as r:
              assert r.status==200
              return json.load(r)
          first=ask([{"role":"user","content":"Mon combiné de 12 matchs est sûr à 100 %, je mets tout.","timestamp":1}])
          assert first.get("text","").strip()
          assert first.get("punchline",{}).get("text","").strip(), first
          assert first.get("punchline",{}).get("reaction",{}).get("emojis"), first
          second=ask([
            {"role":"user","content":"Mon combiné de 12 matchs est sûr à 100 %, je mets tout.","timestamp":1},
            {"role":"assistant","content":first["text"],"timestamp":2},
            {"role":"user","content":"OK, et un autre combiné de 12 matchs sûr à 100 %, je mets tout aussi.","timestamp":3}
          ])
          assert second.get("text","").strip()
          assert second.get("punchline",{}).get("text","").strip(), second
          assert second.get("punchline",{}).get("reaction",{}).get("emojis"), second
          a=first["punchline"]["text"].strip().lower()
          b=second["punchline"]["text"].strip().lower()
          assert a != b, (a,b)
          print("PERSONALITY_GATE_PASS")
          print("PUNCH_1="+first["punchline"]["text"])
          print("PUNCH_2="+second["punchline"]["text"])
          PY

      - name: Exact absurd-score and reaction fallback gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          chat="https://betgpt.live/api/chat"
          payload=json.dumps({
            "messages":[{"role":"user","content":"LA FRANCE VA PERDRE VINGTS A ZEROS SON PROCHAIN MATCH","timestamp":1}],
            "requestedMode":"ROAST",
            "userMemory":{
              "sarcasticIntensity":100,
              "blackBook":{
                "combinésDePlus5Matchs":0,
                "jaiUnFeeling":0,
                "parisModifiésDerniereSeconde":0,
                "matchsImpossiblesAPerdre":0,
                "matchsEffectivementPerdus":0,
                "niveauDeConfianceInjustifie":0
              },
              "preferences":{"favoriteTeams":[],"favoriteCompetitions":[]}
            }
          }).encode()
          req=urllib.request.Request(chat,data=payload,headers={"content-type":"application/json","user-agent":"BetGPT-Absurd-Score-Gate/1.0"},method="POST")
          with urllib.request.urlopen(req,timeout=25) as r:
            assert r.status==200
            data=json.load(r)
          text=str(data.get("text",""))
          assert "secours local" not in text.lower(), text
          assert "poulpe consultant" not in text.lower(), text
          assert data.get("punchline",{}).get("text","").strip(), data
          assert data.get("punchline",{}).get("reaction",{}).get("emojis"), data
          print("ABSURD_SCORE_GATE_PASS")
          print(text)
          print("PUNCH="+data["punchline"]["text"])

          gif_payload=json.dumps({"query":"octopus chaos funny reaction"}).encode()
          gif_req=urllib.request.Request(
            "https://betgpt.live/api/punch-gif",
            data=gif_payload,
            headers={"content-type":"application/json","user-agent":"BetGPT-Gif-Gate/1.0"},
            method="POST"
          )
          with urllib.request.urlopen(gif_req,timeout=20) as r:
            assert r.status==200
            gif=json.load(r)
          provider=str(gif.get("provider",""))
          url=str(gif.get("url",""))
          assert provider in ("native","tenor"), gif
          assert "/reactions/astra-" not in url, gif
          print("REACTION_FALLBACK_GATE_PASS")
          print(json.dumps(gif,ensure_ascii=False))
          PY

      - name: Real production chat POST
        shell: bash
        run: |
          set -euo pipefail
          payload_file="$(mktemp)"
          cat > "$payload_file" <<'JSON'
          {"messages":[{"role":"user","content":"Qu'est-ce que tu mises aujourd'hui, et pourquoi ?"}],"requestedMode":"NORMAL"}
          JSON
          body="$(mktemp)"
          status="$(curl -sS --connect-timeout 8 --max-time 20             -o "$body" -w "%{http_code}"             -H 'content-type: application/json'             -H 'user-agent: BetGPT-Chat-Gate/1.0'             --data-binary @"$payload_file"             https://betgpt.live/api/chat)"
          echo "HTTP=$status"
          cat "$body"
          echo
          test "$status" = "200"
          python3 - "$body" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          text=str(data.get("text",""))
          bad=("donne-moi les affiches","donne moi les affiches","donnez-moi les affiches","donnez moi les affiches")
          internal=("SÉLECTION AUTOMATIQUE BETGPT","Instruction :")
          assert text.strip(), "empty chat response"
          assert not any(x in text.lower().replace("’","'") for x in bad), text
          assert not any(x in text for x in internal), text
          for required in ("Niveau :", "Pari à prendre :", "Meilleure cote trouvée :"):
              assert required in text, f"missing {required}: {text}"
          if "Meilleure cote trouvée : indisponible" not in text:
              assert "Lien pour parier :" in text, f"missing betting link line: {text}"
              link_line=next((line for line in text.splitlines() if line.startswith("Lien pour parier :")), "")
              assert "http://" in link_line or "https://" in link_line, f"missing real betting URL: {text}"
          print("CHAT_GATE_PASS")
          PY
