name: UNIVERSAL SKILLS public proof — isolated and free
on:
  push:
    branches:
      - ci/universal-skills-omega-20261012
    paths:
      - 'tools/universal-skill-intelligence/**'
      - '.github/workflows/universal-skills-public-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: tools/universal-skill-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact copied engine with standard Node
        run: |
          node --version
          node --check scripts/universal-skill-intelligence.mjs
          node --test scripts/universal-skill-intelligence.test.mjs
      - name: Probe live skills.sh API and GitHub provenance without installing code
        run: |
          node scripts/universal-skill-intelligence.mjs \
            --config=config/public-probe.json \
            --project=public-smoke \
            --verifyTop=1 \
            --report=artifacts/public-proof/report.json \
            --strict
      - name: Publish evidence even if live probe fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-skills-public-proof
          path: tools/universal-skill-intelligence/artifacts/public-proof/report.json
          if-no-files-found: warn
          retention-days: 7
