name: Import full BetGPT source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-full-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified BetGPT archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3             "https://duality-x-v02.floot.app/_cdn/static/b8cc583d-59e9-48fa-87ca-b30365c460fa-betgpt-source.part01"             -o /tmp/betgpt.part01
          curl -fL --retry 4 --retry-delay 3             "https://duality-x-v02.floot.app/_cdn/static/946853dc-20bb-428a-a415-31bb1cf3bc08-betgpt-source.part02"             -o /tmp/betgpt.part02
          cat /tmp/betgpt.part01 /tmp/betgpt.part02 > /tmp/BETGPT-RAILWAY-SOURCE.zip
          echo "8071b5ef909a3ba595109802c98eb47230b70848183c739494c1ecf604608580  /tmp/BETGPT-RAILWAY-SOURCE.zip" | sha256sum -c -

      - name: Extract and validate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/betgpt-import
          mkdir -p /tmp/betgpt-import
          unzip -q /tmp/BETGPT-RAILWAY-SOURCE.zip -d /tmp/betgpt-import
          SRC="/tmp/betgpt-import/betgpt_master_final"
          test -f "$SRC/package.json"
          test -f "$SRC/package-lock.json"
          test -f "$SRC/src/engine/roi5-dominance-gate.ts"
          test -f "$SRC/src/engine/pipeline.ts"
          test -f "$SRC/ROI-CANONICAL-CHAMPION-SHADOW-V1.md"
          COUNT="$(find "$SRC" -type f | wc -l | tr -d ' ')"
          test "$COUNT" = "908"
          echo "Validated full source: $COUNT files"

      - name: Replace bootstrap repository with full source
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/betgpt-import/betgpt_master_final/"
          rsync -a --delete             --exclude=".git/"             --exclude=".github/workflows/import-full-source.yml"             "$SRC" ./
          rm -f .github/workflows/import-full-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          COUNT="$(find . -type f ! -path "./.git/*" | wc -l | tr -d ' ')"
          test "$COUNT" = "908"
          test ! -f bootstrap.mjs
          echo "Repository now contains $COUNT source files"

      - name: Commit complete autonomous source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BetGPT Source Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: replace bootstrap with complete BetGPT production source"
          git push origin HEAD:main
