name: ASTRA Never-Fail Candidate Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: astra-never-fail-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate-gate:
    name: Candidate gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: ASTRA never-fail pre-promotion gate
        run: npm run release:candidate
