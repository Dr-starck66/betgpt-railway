name: ASTRA Never-Fail Candidate Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: astra-never-fail-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  candidate-gate:
    name: Candidate gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Run immutable candidate gate
        id: gate
        continue-on-error: true
        run: npm run release:candidate

      - name: Confirm GREEN candidate
        if: steps.gate.outcome == 'success'
        run: echo "ASTRA_NEVER_FAIL_CANDIDATE_GREEN sha=${{ github.sha }}"

      - name: Apply deterministic SEO self-heal
        if: steps.gate.outcome != 'success'
        run: node scripts/astra-seo-self-heal.mjs --apply

      - name: Require a real source repair
        if: steps.gate.outcome != 'success'
        shell: bash
        run: |
          if git diff --quiet -- src/lib/sitemap-urls.ts src/lib/seo/astra-self-heal-sitemap.ts; then
            echo "ASTRA_SEO_SELF_HEAL_BLOCKED: no safe source repair was produced."
            exit 78
          fi
          git diff --check

      - name: Revalidate repaired working tree end-to-end
        if: steps.gate.outcome != 'success'
        run: npm run release:candidate

      - name: Refuse stale auto-repair
        if: steps.gate.outcome != 'success'
        shell: bash
        env:
          ORIGINAL_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN" != "$ORIGINAL_SHA" ]; then
            echo "ASTRA_SEO_SELF_HEAL_BLOCKED: main advanced from $ORIGINAL_SHA to $CURRENT_MAIN"
            exit 78
          fi

      - name: Commit verified SEO repair
        if: steps.gate.outcome != 'success'
        shell: bash
        env:
          ORIGINAL_SHA: ${{ github.sha }}
        run: |
          git config user.name "ASTRA SEO Self-Heal"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/sitemap-urls.ts src/lib/seo/astra-self-heal-sitemap.ts
          git commit -m "seo(self-heal): repair verified regression from $ORIGINAL_SHA"
          git push origin HEAD:main

      - name: Dispatch immutable gate for repaired SHA
        if: steps.gate.outcome != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/astra-never-fail.yml/dispatches"             -d '{"ref":"main"}'

      - name: Keep original broken SHA non-promotable
        if: steps.gate.outcome != 'success'
        shell: bash
        run: |
          echo "ASTRA_SELF_HEAL_REPAIR_COMMITTED: original SHA remains intentionally RED."
          exit 1
