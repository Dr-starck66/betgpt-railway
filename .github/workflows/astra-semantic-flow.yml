name: ASTRA Semantic Flow Guard Ω

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/astra-semantic-flow*"
      - "config/astra-semantic-flow.json"
      - "package.json"
      - ".github/workflows/astra-semantic-flow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prove guard catches injected failures
        run: node --test scripts/astra-semantic-flow.test.mjs

      - name: Prove auto-repair stays safe and fail-closed
        run: node --test scripts/astra-semantic-flow-autorepair.test.mjs

      - name: Apply only deterministic semantic repairs
        run: node scripts/astra-semantic-flow-autorepair.mjs --apply --strict

      - name: Audit repaired BetGPT semantic graph
        run: node scripts/astra-semantic-flow-guard.mjs --strict

      - name: Upload semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-semantic-flow-evidence
          path: |
            artifacts/seo/semantic-flow.json
            artifacts/seo/semantic-autorepair.json
            src/lib/seo/semantic-auto-links.generated.ts
          if-no-files-found: warn
