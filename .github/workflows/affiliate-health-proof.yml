name: ASTRA Affiliate Health Proof

on:
  push:
    branches:
      - astra-affiliate-health-proof
    paths:
      - ".github/workflows/affiliate-health-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public affiliate state and redirect
        shell: bash
        run: |
          set -euo pipefail
          health="$(mktemp)"
          hs="$(curl -sS --connect-timeout 8 --max-time 20 -o "$health" -w "%{http_code}" https://betgpt.live/api/affiliate-health)"
          echo "HEALTH_HTTP=$hs"
          cat "$health"
          echo
          test "$hs" = "200"

          expected="$(python3 - "$health" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d.get("schema")=="astra-affiliate-conversion/v1", d
          assert d.get("status") in ("TRACKING_READY","MONETIZED"), d
          assert d.get("trackingReady") is True, d
          books=d.get("books") or []
          assert books, d
          for b in books:
            assert "tag" not in b and "secret" not in b and "value" not in b, b
          u=next((b for b in books if b.get("key")=="unibet"),None)
          assert u, d
          print(u["mode"].lower())
          print("AFFILIATE_HEALTH_PASS status="+d["status"]+" monetizedCount="+str(d.get("monetizedCount")), file=sys.stderr)
          PY
          )"

          headers="$(mktemp)"
          rs="$(curl -sS --connect-timeout 8 --max-time 20 --max-redirs 0 -o /dev/null -D "$headers" -w "%{http_code}" 'https://betgpt.live/api/go?b=Unibet&m=astra-proof&u=https%3A%2F%2Fwww.unibet.fr%2Fparis-football' || true)"
          echo "REDIRECT_HTTP=$rs"
          cat "$headers"
          test "$rs" = "302"

          python3 - "$headers" "$expected" <<'PY'
          import re,sys
          h=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          expected=sys.argv[2].strip()
          loc=re.search(r'(?im)^location:\s*(https://[^\r\n]+)',h)
          mode=re.search(r'(?im)^x-betgpt-affiliate-mode:\s*([^\r\n]+)',h)
          book=re.search(r'(?im)^x-betgpt-affiliate-book:\s*([^\r\n]+)',h)
          assert loc and mode and book, h
          assert mode.group(1).strip()==expected, (mode.group(1),expected)
          assert book.group(1).strip()=="unibet", book.group(1)
          assert "utm_source=betgpt" in loc.group(1), loc.group(1)
          assert "utm_medium=affiliate" in loc.group(1), loc.group(1)
          print("REDIRECT_LOCATION="+loc.group(1))
          print("AFFILIATE_MODE="+mode.group(1).strip())
          print("ASTRA_AFFILIATE_HEALTH_PROOF_PASS")
          PY
