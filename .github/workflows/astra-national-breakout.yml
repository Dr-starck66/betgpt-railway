name: ASTRA National Breakout Ω

on:
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"

permissions:
  contents: read

concurrency:
  group: astra-national-breakout
  cancel-in-progress: true

jobs:
  growth-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production growth scorecard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/national-breakout
          code="$(curl -sS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30             -o artifacts/national-breakout/scorecard.json             -w "%{http_code}"             -H 'accept: application/json'             -H 'cache-control: no-cache'             -H 'user-agent: ASTRA-NATIONAL-BREAKOUT/1.0'             https://betgpt.live/api/national-breakout)"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          p="artifacts/national-breakout/scorecard.json"
          data=json.load(open(p,encoding="utf-8"))
          assert data.get("health")=="PASS", data
          assert data.get("schema")=="astra-national-breakout/v1", data
          assert data.get("score") is None or isinstance(data.get("score"), int), data
          assert data.get("status") in ("UNVERIFIED","FIX","BUILD","ACCELERATE"), data
          actions=data.get("actions") or []
          print("ASTRA_NATIONAL_BREAKOUT_PASS")
          print("score=",data.get("score"),"status=",data.get("status"))
          for i,a in enumerate(actions[:3],1):
              print(f"{i}. {a.get('title')} [{a.get('loop')}] priority={a.get('priority')}")
          PY

      - name: Upload growth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-national-breakout
          path: artifacts/national-breakout/
          if-no-files-found: error
          retention-days: 30
