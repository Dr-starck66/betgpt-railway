name: BetGPT Odds Comparator Gate

on:
  push:
    paths:
      - ".github/workflows/odds-comparator-gate.yml"
      - ".github/odds-comparator-gate.trigger"
      - "scripts/astra-wait-public-revision.mjs"

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for public autosync revision
        run: node scripts/astra-wait-public-revision.mjs "$GITHUB_SHA"

      - name: Public odds comparator gate
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -sS --connect-timeout 8 --max-time 25 -o "$body" -w "%{http_code}" -H 'user-agent: BetGPT-Odds-Gate/1.0' https://betgpt.live/comparer-cotes)"
          echo "HTTP=$status"
          test "$status" = "200"
          python3 - "$body" <<'PY'
          import re,sys
          html=open(sys.argv[1],encoding="utf-8").read()
          assert "Comparer les cotes football" in html, "missing comparator heading"
          flags=("🇫🇷","🇪🇸","🇩🇪","🇮🇹","🇳🇱","🇵🇹","🇹🇷","🇪🇺","🌍","🇹🇿","🇸🇳","🇳🇬","🇲🇦","🇩🇿","🇵🇱","🏴")
          has_flag_emoji=any(x in html for x in flags)
          has_flag_image=('alt="Drapeau ' in html) or ('flagcdn.com/' in html) or ('twemoji@latest/assets/svg/' in html)
          assert has_flag_emoji or has_flag_image, "missing country/competition flags"
          assert "Parier chez" in html, "missing clickable odds aria-label"
          assert re.search(r'href="https://(?:www\.)?(?:unibet\.fr|betclic\.fr|netbet\.fr|winamax\.fr|pmu\.fr|sports\.bwin\.fr|zebet\.fr|vbet\.fr)', html), "missing real bookmaker external href"
          print("ODDS_GATE_PASS")
          PY


