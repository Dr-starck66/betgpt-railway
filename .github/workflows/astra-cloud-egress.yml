name: ASTRA Cloud Egress Ω

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "scripts/astra-cloud-egress.mjs"
      - "scripts/astra-public-autosync.mjs"
      - "scripts/astra-wait-public-revision.mjs"
      - "config/astra-cloud-egress.json"
      - ".github/workflows/astra-cloud-egress.yml"

permissions:
  contents: read

concurrency:
  group: astra-cloud-egress
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate egress config
        run: node scripts/astra-cloud-egress.mjs config/astra-cloud-egress.json --validate-config

      - name: Validate public autosync syntax
        run: node --check scripts/astra-public-autosync.mjs

      - name: Wait for public autosync revision
        run: node scripts/astra-wait-public-revision.mjs "$GITHUB_SHA"

      - name: Verify from independent cloud network
        id: egress
        continue-on-error: true
        run: node scripts/astra-cloud-egress.mjs config/astra-cloud-egress.json

      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/cloud-egress/summary.md ]; then
            cat artifacts/cloud-egress/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# ASTRA CLOUD EGRESS Ω" >> "$GITHUB_STEP_SUMMARY"
            echo "Evidence missing — FAIL." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-cloud-egress-evidence
          path: artifacts/cloud-egress/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce remote verification
        if: always()
        shell: bash
        run: |
          test -f artifacts/cloud-egress/evidence.json
          node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync("artifacts/cloud-egress/evidence.json","utf8"));console.log("ASTRA CLOUD EGRESS FINAL",e.status,e.selectedTarget);if(e.status!=="PASS")process.exit(1)'
