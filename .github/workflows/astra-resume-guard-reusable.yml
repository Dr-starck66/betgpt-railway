name: ASTRA RESUME GUARD Ω — Reusable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate resumability contract
        run: node scripts/astra-resume-guard.mjs
