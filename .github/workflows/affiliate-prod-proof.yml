name: ASTRA Affiliate Production Proof

on:
  push:
    branches:
      - astra-affiliate-prod-proof
    paths:
      - ".github/workflows/affiliate-prod-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Chat to tracked redirect proof
        shell: bash
        run: |
          set -euo pipefail
          payload="$(mktemp)"
          cat > "$payload" <<'JSON'
          {"messages":[{"role":"user","content":"Qu'est-ce que tu mises aujourd'hui, et pourquoi ?"}],"requestedMode":"NORMAL"}
          JSON
          body="$(mktemp)"
          status="$(curl -sS --connect-timeout 8 --max-time 25 -o "$body" -w "%{http_code}" -H 'content-type: application/json' -H 'user-agent: ASTRA-Affiliate-Proof/1.0' --data-binary @"$payload" https://betgpt.live/api/chat)"
          echo "CHAT_HTTP=$status"
          cat "$body"
          echo
          test "$status" = "200"
          link="$(python3 - "$body" <<'PY'
          import json,re,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          text=str(data.get("text",""))
          assert "Meilleure cote trouvée :" in text, text
          m=re.search(r'^Lien pour parier : (https://betgpt\.live/api/go\?\S+)', text, re.M)
          assert m, "missing tracked BetGPT link: "+text
          print(m.group(1))
          PY
          )"
          echo "TRACKED_LINK=$link"
          headers="$(mktemp)"
          redirect_status="$(curl -sS --connect-timeout 8 --max-time 20 --max-redirs 0 -o /dev/null -D "$headers" -w "%{http_code}" "$link" || true)"
          echo "REDIRECT_HTTP=$redirect_status"
          cat "$headers"
          test "$redirect_status" = "302"
          python3 - "$headers" <<'PY'
          import re,sys
          h=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          m=re.search(r'(?im)^location:\s*(https://[^\r\n]+)',h)
          assert m, h
          loc=m.group(1)
          assert re.match(r'https://(?:www\.)?(?:unibet\.fr|betclic\.fr|netbet\.fr|winamax\.fr|pmu\.fr|sports\.bwin\.fr|zebet\.fr|vbet\.fr)(?:/|$)',loc), loc
          assert "utm_source=betgpt" in loc, loc
          assert "utm_medium=affiliate" in loc, loc
          print("REDIRECT_LOCATION="+loc)
          print("ASTRA_AFFILIATE_PROD_PASS")
          PY
