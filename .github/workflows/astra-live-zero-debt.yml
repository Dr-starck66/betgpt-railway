name: ASTRA Live Zero Debt
on:
  push:
    branches:
      - astra/live-verify-zero-debt-8e9e

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact live revision and repaired corpus
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="94b8e0be3968e65ac8d0dbc16de2d36c2a1c0e60"
          fetch() {
            local url="$1" out="$2"
            curl --compressed --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 2 -o "$out" -w "%{http_code}" "$url"
          }

          rev_status="$(fetch "https://betgpt.live/astra-revision.json" rev.txt)"
          d_status="$(fetch "https://betgpt.live/actualites/equipe-de-france-dembele-est-il-le-leader-d-attaque-2026-10-01" dembele.html)"
          a_status="$(fetch "https://betgpt.live/actualites/azerbaijan-liechtenstein-postmatch-2026-10-01" az.html)"
          s_status="$(fetch "https://betgpt.live/sitemap.xml" sitemap.xml)"

          echo "STATUS revision=$rev_status dembele=$d_status azerbaijan=$a_status sitemap=$s_status"

          test "$rev_status" = "200"
          test "$d_status" = "200"
          test "$a_status" = "200"
          test "$s_status" = "200"

          failures=0
          check() {
            local name="$1" file="$2" needle="$3"
            if grep -aqF "$needle" "$file"; then
              echo "CHECK $name=PASS"
            else
              echo "CHECK $name=FAIL"
              failures=$((failures+1))
            fi
          }

          check revision rev.txt "$EXPECTED"
          check dembele_sources dembele.html "Sources de ce passage"
          check dembele_fff dembele.html "Fédération Française de Football"
          check dembele_fff_url dembele.html "www.fff.fr/selection/matchs/3776-france-italie.html"
          check azerbaijan_sources az.html "Sources de ce passage"

          count="$(grep -ao 'https://betgpt.live/auteurs/betgpt-editorial' sitemap.xml | wc -l | tr -d ' ')"
          echo "AUTHOR_SITEMAP_COUNT=$count"
          if [ "$count" != "1" ]; then failures=$((failures+1)); fi

          test "$failures" = "0"
          echo "ASTRA_LIVE_ZERO_DEBT_PASS sourceSha=$EXPECTED dembele_contextual_sources=present fff_official=present azerbaijan_contextual_sources=present author_sitemap_count=$count"
