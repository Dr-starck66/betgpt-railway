name: ASTRA Single-Source Release Gate Ω

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/astra-release-gate.mjs"
      - "scripts/astra-deploy-sync-gate.mjs"
      - "scripts/astra-green-release-sync.mjs"
      - "scripts/ts-alias-hooks.mjs"
      - "scripts/astra-safe-push.mjs"
      - "scripts/astra-public-proxy.mjs"
      - "server/middleware/astra-single-source.ts"
      - "config/astra-release-gate.json"
      - "docs/astra/ASTRA_DEPLOY_SYNC_GATE.md"
      - ".github/workflows/astra-release-gate.yml"
      - "package.json"
  pull_request:
    paths:
      - "scripts/astra-release-gate.mjs"
      - "scripts/ts-alias-hooks.mjs"
      - "config/astra-release-gate.json"
      - ".github/workflows/astra-release-gate.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate gate manifest
        run: npm run release:validate
      - name: Full fail-closed preflight
        run: npm run release:preflight
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-release-gate-preflight
          path: artifacts/astra-release-gate/
          if-no-files-found: error
          retention-days: 30

  drift-sentinel:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify GREEN release ↔ manifest ↔ public revision
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            if node scripts/astra-green-release-sync.mjs; then
              echo "ASTRA_GREEN_CONVERGENCE_PASS attempt=$i"
              exit 0
            fi
            echo "ASTRA_GREEN_CONVERGENCE_WAIT attempt=$i"
            sleep 10
          done
          echo "ASTRA_GREEN_CONVERGENCE_FAIL after=18"
          exit 1
      - name: Validate public/canonical convergence
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 8); do
            if node scripts/astra-release-gate.mjs postflight; then
              echo "ASTRA_POSTFLIGHT_CONVERGENCE_PASS attempt=$i"
              exit 0
            fi
            echo "ASTRA_POSTFLIGHT_CONVERGENCE_WAIT attempt=$i"
            sleep 10
          done
          echo "ASTRA_POSTFLIGHT_CONVERGENCE_FAIL after=8"
          exit 1
      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-release-gate-postflight
          path: artifacts/astra-release-gate/
          if-no-files-found: warn
          retention-days: 30
