name: ASTRA Chat Browser Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/chat-browser-gate.yml"
      - "src/components/chat-panel.tsx"
      - "src/components/chat-diploma.tsx"
      - "src/lib/chat/reaction.ts"
      - "server/api/punch-gif.post.ts"
      - "server/api/punch-voice.post.ts"
      - "src/lib/chat/voice.ts"
      - "public/reactions/**"
      - "src/routes/chat.tsx"
      - "src/routes/__root.tsx"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify real mobile chat interaction
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          await page.addInitScript(()=>localStorage.setItem("betgpt-18","1"));
          const errors=[]; const bad=[];
          page.on("console",m=>{if(m.type()==="error")errors.push(m.text())});
          page.on("pageerror",e=>errors.push(e.message));
          page.on("response",r=>{if(r.status()>=400)bad.push(r.status()+" "+r.url())});
          await page.goto("https://betgpt.live/chat",{waitUntil:"domcontentloaded",timeout:30000});
          await page.waitForTimeout(1500);
          const age=page.getByRole("button",{name:/18 ans ou plus/i});
          if(await age.isVisible().catch(()=>false)) {
            await age.click({timeout:10000});
            await page.waitForTimeout(500);
            console.log("AGE_GATE_PASS");
          }
          const essential=page.getByRole("button",{name:"Essentiels seulement",exact:true});
          if(await essential.isVisible().catch(()=>false)) {
            await essential.click({timeout:10000});
            await page.waitForTimeout(300);
            console.log("COOKIE_GATE_PASS");
          }
          const overlays=await page.locator("div.fixed.inset-0").evaluateAll(nodes=>nodes.map(n=>({className:n.className,text:(n.innerText||"").slice(0,1200),buttons:Array.from(n.querySelectorAll("button,a")).map(x=>(x.innerText||x.getAttribute("aria-label")||"").trim()).filter(Boolean)})));
          console.log("OVERLAYS_AFTER_GATES="+JSON.stringify(overlays));
          const normalButton=page.getByRole("button",{name:"Normal",exact:true});
          if(await normalButton.count()) throw new Error("NORMAL_MODE_STILL_EXPOSED");
          const roastBadge=page.getByLabel("Mode Sans filtre permanent");
          await roastBadge.waitFor({state:"visible",timeout:10000});
          console.log("ROAST_ONLY_UI_PASS");
          const box=page.getByRole("textbox",{name:"Ton message à BetGPT"});
          await box.fill("La France va perdre 25-0 son prochain match.");
          await page.getByRole("button",{name:"Envoyer",exact:true}).click({timeout:10000});
          await page.getByText(/calamar|asile|carton rouge|score pareil/i).first().waitFor({timeout:25000});
          const reactionGif=page.locator('figure[aria-label="Réaction GIF BetGPT"] img').first();
          await reactionGif.waitFor({state:"visible",timeout:10000});
          const gifSrc=await reactionGif.getAttribute("src");
          if(!gifSrc || !/\.gif(?:\?|$)/i.test(gifSrc)) throw new Error("REACTION_GIF_NOT_RENDERED");
          const emojiStrip=page.getByLabel("Émoticônes de réaction BetGPT").first();
          await emojiStrip.waitFor({state:"visible",timeout:10000});
          const emojiText=(await emojiStrip.textContent())?.trim()||"";
          if(!emojiText) throw new Error("REACTION_EMOJIS_NOT_RENDERED");
          console.log("REACTION_GIF_PASS="+gifSrc);
          console.log("REACTION_EMOJIS_PASS="+emojiText);
          await page.waitForTimeout(500);
          const punchVoice5xx=bad.filter(x=>{const parts=x.split(" "); const status=parts[0]||""; const url=parts.slice(1).join(" "); return status.length===3 && status.startsWith("5") && url.startsWith("https://betgpt.live/api/punch-voice");});
          if(punchVoice5xx.length) throw new Error("PUNCH_VOICE_5XX="+JSON.stringify(punchVoice5xx));
          console.log("PUNCH_VOICE_DEGRADE_PASS");
          await box.fill("Mon combiné de 10 matchs est sûr à 100%, je mets tout.");
          await page.getByRole("button",{name:"Envoyer",exact:true}).click({timeout:10000});
          const enlarge=page.getByRole("button",{name:/Agrandir le diplôme/i}).first();
          await enlarge.waitFor({state:"visible",timeout:25000});
          await enlarge.click({timeout:10000});
          const diplomaDialog=page.getByRole("dialog",{name:/Diplôme BetGPT en plein écran/i});
          await diplomaDialog.waitFor({state:"visible",timeout:10000});
          const rect=await diplomaDialog.boundingBox();
          if(!rect || rect.width < 380 || rect.height < 830) throw new Error("DIPLOMA_NOT_FULLSCREEN");
          console.log("DIPLOMA_FULLSCREEN_PASS="+JSON.stringify(rect));
          await page.getByRole("button",{name:"Fermer le diplôme en plein écran",exact:true}).click({timeout:10000});
          await diplomaDialog.waitFor({state:"hidden",timeout:10000});
          console.log("DIPLOMA_FULLSCREEN_CLOSE_PASS");
          console.log("ASTRA_CHAT_BROWSER_PASS");
          console.log("BROWSER_ERRORS="+JSON.stringify(errors));
          console.log("HTTP_ERRORS="+JSON.stringify(bad));
          await browser.close();
          EOF
