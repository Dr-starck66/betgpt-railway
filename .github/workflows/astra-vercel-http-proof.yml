name: ASTRA Vercel article HTTP proof (one-shot)
on:
  push:
    branches:
      - astra/vercel-editorial-failclosed-20261031
    paths:
      - .github/workflows/astra-vercel-http-proof.yml

permissions:
  contents: read

jobs:
  public-http-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify article HTTP and two independent deployment builds
        env:
          OLD_BASE: https://betgpt-r1liamtym-ced-starcks-projects.vercel.app
          NEW_BASE: https://betgpt-iz6o67gjf-ced-starcks-projects.vercel.app
          CANDIDATE_BASE: https://betgpt-ibv972my9-ced-starcks-projects.vercel.app
          PUBLISHED_SLUG: psg-lyon-reporte-lundi-26-octobre-2026
          UNPUBLISHED_SLUG: le-havre-psg-1-5-hakimi-triple-analyse-30-octobre-2026
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.request, urllib.error
          def probe(url):
              req=urllib.request.Request(url,headers={'User-Agent':'ASTRA-Vercel-HTTP-proof/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=24) as rsp:
                      return rsp.status,rsp.geturl(),rsp.read(200000).decode('utf-8','replace')
              except urllib.error.HTTPError as ex:
                  return ex.code,ex.geturl(),ex.read(4000).decode('utf-8','replace')
          checks=[]
          for label,base in [('old',os.environ['OLD_BASE']),('new',os.environ['NEW_BASE'])]:
              for attempt in range(1,3):
                  url=base+'/actualites/'+os.environ['PUBLISHED_SLUG']
                  status,final,html=probe(url)
                  main=('PSG' in html and 'Lyon' in html)
                  canonical=bool(re.search(r'<link[^>]+canonical',html,re.I))
                  noindex=bool(re.search(r'<meta[^>]+noindex',html,re.I))
                  record={'deployment':label,'attempt':attempt,'status':status,'final':final,
                          'bytes':len(html.encode()),'articleContent':main,'canonical':canonical,'noindex':noindex}
                  print('ASTRA_HTTP_PROOF',json.dumps(record),flush=True)
                  checks.append(status==200 and main and canonical and not noindex)
                  time.sleep(3)
          status,final,html=probe(os.environ['NEW_BASE']+'/news-sitemap.xml')
          print('ASTRA_SITEMAP_PROOF',json.dumps({'status':status,'url':final,'bytes':len(html.encode())}),flush=True)
          checks.append(status==200 and ('sitemap' in html or 'urlset' in html))
          status,final,html=probe(os.environ['NEW_BASE']+'/api/editorial-agent-status')
          print('ASTRA_AGENT_STATUS_PROOF',json.dumps({'status':status,'url':final,'jsonMode':('ASTRA_AGENT_GITHUB_VERCEL' in html)}),flush=True)
          checks.append(status==200 and 'ASTRA_AGENT_GITHUB_VERCEL' in html)
          status,final,html=probe(os.environ['CANDIDATE_BASE']+'/actualites/'+os.environ['UNPUBLISHED_SLUG'])
          print('ASTRA_NEGATIVE_CONTROL',json.dumps({'status':status,'url':final,'bytes':len(html.encode())}),flush=True)
          checks.append(status in (404,410))
          print('ASTRA_HTTP_FINAL', 'PASS' if all(checks) else 'FAIL', 'checks='+str(len(checks)), flush=True)
          if not all(checks):
              raise SystemExit(1)
          PY
