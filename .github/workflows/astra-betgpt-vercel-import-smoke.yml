name: ASTRA BetGPT Vercel Bundle Import Smoke (isolated)
on:
  push:
    branches: [astra/vercel-full-ssr-restore-20261104]
    paths: [".github/workflows/astra-betgpt-vercel-import-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vercel-import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate the real Vercel Nitro bundle
        run: NITRO_PRESET=vercel npm run build
      - name: Verify bundle, exported handler, and import-time startup
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/output/functions/__server.func/index.mjs
          echo "ASTRA_VERCEL_FUNCTION_ENTRY_FOUND"
          node --input-type=module <<'NODE'
          try {
            const mod = await import("./.vercel/output/functions/__server.func/index.mjs");
            console.log("ASTRA_VERCEL_MODULE_IMPORT_PASS", Object.keys(mod).join(","));
            console.log("ASTRA_VERCEL_DEFAULT_TYPE", typeof mod.default); console.log("ASTRA_VERCEL_DEFAULT_KEYS", Object.keys(mod.default ?? {}).slice(0,25).join(",")); console.log("ASTRA_VERCEL_FUNCTION_EXPORTS", Object.entries(mod).filter(([k,v])=>typeof v==="function").map(([k])=>k).join(","));
            if (typeof mod.default !== "function" && typeof mod.default?.fetch !== "function" && typeof mod.default?.handler !== "function") throw new Error("no callable function in default export");
            if (typeof mod.default?.fetch === "function") { const response = await Promise.race([mod.default.fetch(new Request("https://betgpt.live/api/health")), new Promise((_, reject) => setTimeout(() => reject(new Error("fetch handler timed out")), 12000))]); const body = await response.text(); console.log("ASTRA_VERCEL_HANDLER_HEALTH", response.status, body.slice(0,500)); if(response.status !== 200) throw new Error("bundled Vercel handler health non-200"); }
          } catch (e) {
            console.error("ASTRA_VERCEL_FUNCTION_IMPORT_FAIL", e?.stack || e);
            process.exitCode = 1;
          }
          NODE
