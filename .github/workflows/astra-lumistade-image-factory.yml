name: ASTRA Lumistade Image Factory Ω
on:
  push:
    branches:
      - astra/lumistade-images-unique-20261024
    paths:
      - scripts/astra-lumistade-generate-images.py
      - .github/workflows/astra-lumistade-image-factory.yml
  workflow_dispatch:

permissions:
  contents: write
jobs:
  render-unique-editorial-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate ten 1600x900 JPEG images
        run: python scripts/astra-lumistade-generate-images.py
      - name: Verify ten unique editorial images
        shell: bash
        run: |
          python - <<'PY'
          from glob import glob
          from pathlib import Path
          from hashlib import sha256
          from PIL import Image
          files=sorted(glob('public/blog/discover/lumistade/*.jpg'))
          assert len(files)==10,files
          digests=[]
          for f in files:
              with Image.open(f) as im:
                  assert im.size==(1600,900) and im.format=='JPEG',f
              digests.append(sha256(Path(f).read_bytes()).hexdigest())
          assert len(set(digests))==len(files),"duplicate images"
          print("ASTRA_IMAGE_INTEGRITY_PASS: 10/10 JPEG >=1200, unique SHA")
          PY
      - name: Commit generated assets to the same feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ASTRA Image Factory"
          git config user.email "actions@users.noreply.github.com"
          git add public/blog/discover/lumistade/*.jpg
          if git diff --cached --quiet; then
            echo "ASTRA_IMAGE_FACTORY_NOOP: images already committed"
          else
            git commit -m "assets: ten unique Lumistade SEO image variants 1600x900"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
