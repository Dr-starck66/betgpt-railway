name: ASTRA Social Amplifier Omega

on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["editorial-publish"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/astra-social-amplifier*"
      - "scripts/astra-social-oauth-vault*"
      - "scripts/astra-social-oauth-vault*"
      - "config/astra-social-sites.json"
      - "data/social/account-vault.json"
      - ".github/workflows/astra-social-amplifier.yml"
  pull_request:
    paths:
      - "scripts/astra-social-amplifier*"
      - "scripts/astra-social-oauth-vault*"
      - "config/astra-social-sites.json"
      - ".github/workflows/astra-social-amplifier.yml"

permissions:
  contents: write

concurrency:
  group: astra-social-amplifier-global
  cancel-in-progress: false

jobs:
  syndicate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test syndication engine without social credentials
        run: node --test scripts/astra-social-amplifier.test.mjs scripts/astra-social-oauth-vault.test.mjs
      - name: Refresh expiring long-lived Instagram grants (never log tokens)
        if: github.event_name != 'pull_request'
        env:
          ASTRA_SOCIAL_VAULT_KEY: ${{ secrets.ASTRA_SOCIAL_VAULT_KEY }}
        run: node scripts/astra-social-oauth-vault.mjs renew
      - name: Persist encrypted rotation receipts (no plaintext credentials)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/social/account-vault.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(social): rotate encrypted OAuth credentials [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Plan new verified articles; baseline the first scan
        if: github.event_name != 'pull_request'
        run: node scripts/astra-social-amplifier.mjs plan
      - name: Persist discovery ledger BEFORE any remote post
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/social/amplifier-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(social): persist verified publication discovery [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Claim authorized Meta jobs (X disabled — zero-cost policy)
        if: github.event_name != 'pull_request'
        env:
          ASTRA_SOCIAL_META_ACCOUNTS_JSON: ${{ secrets.ASTRA_SOCIAL_META_ACCOUNTS_JSON }}
          ASTRA_SOCIAL_VAULT_KEY: ${{ secrets.ASTRA_SOCIAL_VAULT_KEY }}
        run: node scripts/astra-social-amplifier.mjs claim
      - name: Persist claim BEFORE attempting Meta publication
        if: github.event_name != 'pull_request'
        run: |
          git add data/social/amplifier-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(social): claim Instagram jobs before side effects [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish reserved Instagram posts via official Meta API
        if: github.event_name != 'pull_request'
        env:
          ASTRA_SOCIAL_META_ACCOUNTS_JSON: ${{ secrets.ASTRA_SOCIAL_META_ACCOUNTS_JSON }}
          ASTRA_SOCIAL_VAULT_KEY: ${{ secrets.ASTRA_SOCIAL_VAULT_KEY }}
        run: node scripts/astra-social-amplifier.mjs deliver
      - name: Persist remote confirmations; fail closed on push conflict
        if: github.event_name != 'pull_request'
        run: |
          git add data/social/amplifier-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(social): persist Meta publication receipts [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
