name: editorial-publish

on:
  schedule:
    # Opportunity radar: every 30 minutes across the French football news day.
    # It never forces content: the engine remains fail-closed and keeps a 3/day maximum.
    - cron: "17,47 5-22 * * *"
  push:
    branches: [main]
    paths:
      - "src/lib/editorial/**"
      - "src/lib/social/**"
      - "src/lib/social.functions.ts"
      - "src/engine/live.ts"
      - "scripts/ts-alias-hooks.mjs"
      - "scripts/astra-release-gate.mjs"
      - "config/astra-release-gate.json"
      - "scripts/run-editorial-publish.ts"
      - "package.json"
      - ".github/workflows/editorial.yml"
  pull_request:
    paths:
      - "src/lib/editorial/**"
      - "src/lib/social/**"
      - "src/lib/social.functions.ts"
      - "src/routes/admin_.editorial.tsx"
      - "src/routes/admin_.social.tsx"
      - "migrations/0004_social_ledger.sql"
      - "data/social/ledger.json"
      - "scripts/run-editorial-publish.ts"
      - "package.json"
      - "api/editorial-run.ts"
      - ".github/workflows/editorial.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betgpt-editorial-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate ASTRA release manifest
        run: npm run release:validate

      - name: Pull-request release preflight
        if: github.event_name == 'pull_request'
        run: npm run release:preflight

      - name: Transactional editorial publication gate
        if: github.event_name != 'pull_request'
        run: npm run release:pipeline:editorial

      - name: Persist editorial and social ledgers safely
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: >-
          node scripts/astra-safe-push.mjs
          --branch main
          --message "content: auto-publish BetGPT editorial and social ledgers"
          data/editorial/ledger.json
          data/social/ledger.json
